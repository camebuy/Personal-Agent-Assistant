[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-assistant"
version = "1.0.0"
description = "Local-first personal assistant with durable tasks, human approvals and explicit tool boundaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.60,<2",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.23,<5",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
desktop = ["pywinauto>=0.6.8,<0.7; sys_platform == 'win32'"]
ocr = ["easyocr>=1.7,<2"]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
namespaces = true

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["data", "tmp", ".venv", ".git"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
